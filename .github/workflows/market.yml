name: Shared market bulletin
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/market.yml']
permissions:
  contents: write
concurrency:
  group: shared-market
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Test evidence validation
        run: python3 -m unittest discover -s server -p 'test_*.py'
      - name: Test shared client
        run: |
          node server/test_client.cjs
          node server/test_startup.cjs
      - name: Collect and analyse
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 server/market.py agri.json
      - name: Publish shared feed
        if: always()
        run: |
          git config user.name 'Fuel Market updater'
          git config user.email 'fuel-market-updater@users.noreply.github.com'
          cp agri.json "$RUNNER_TEMP/market-result.json"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 server/merge_feed.py agri.json "$RUNNER_TEMP/market-result.json"
            git add agri.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Refresh evidence-grounded market bulletin'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
