name: Shared market bulletin
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/market.yml']
permissions:
  contents: write
concurrency:
  group: shared-market
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test evidence validation
        run: python3 -m unittest discover -s server -p 'test_*.py'
      - name: Test shared client
        run: node server/test_client.cjs
      - name: Collect and analyse
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 server/market.py agri.json
      - name: Publish shared feed
        if: always()
        run: |
          git config user.name 'Fuel Market updater'
          git config user.email 'fuel-market-updater@users.noreply.github.com'
          git add agri.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh evidence-grounded market bulletin'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
